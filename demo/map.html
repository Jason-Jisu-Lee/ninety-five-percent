<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map</title>
<link rel="icon" href="data:,">
<style>
html,body{height:100%;margin:0;background:#0a1312;color:#e9e2d4;font:15px/1.4 ui-monospace,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px 0;box-sizing:border-box;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center}
.set{display:flex;flex-wrap:wrap}
button{border:2px solid #33403c;background:#100d0b;color:#8f877b;font:inherit;padding:5px 12px;cursor:pointer}
button:hover{color:#e9e2d4}
button[aria-pressed=true]{position:relative;border-color:#c9a45c;color:#c9a45c}
.set button{margin-left:-2px}
.go{border-color:#c9a45c;color:#100d0b;background:#c9a45c;font-weight:600}
.go:hover{color:#100d0b;background:#e2c27a}
.stage{position:relative;line-height:0}
canvas{display:block}
.frame{position:absolute;border:2px solid #e9e2d4;box-shadow:0 0 0 2px #0a1312;pointer-events:none;box-sizing:border-box}
.frame span{position:absolute;left:-2px;bottom:100%;line-height:1.4;padding:0 6px;background:#0a1312}
p{margin:0;color:#8f877b;font-size:13px;line-height:1.25}
</style>
<div class="bar"><button class="go" id="new">New map</button><span id="name"></span><div class="set" id="views"></div><p id="cost"></p></div>
<div class="bar"><div class="set" id="owned"></div><div class="set"><button id="all">All</button><button id="none">None</button></div></div>
<div class="stage"><canvas></canvas><div class="frame" hidden><span>First screen</span></div></div>
<script type="module" src="./map.ts"></script>
