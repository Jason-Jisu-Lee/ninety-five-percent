<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninety-Five Percent Demos</title>
<link rel="icon" href="data:,">
<style>
html,body{height:100%;margin:0;background:#0a1312;color:#e9e2d4;font:16px/1.4 ui-monospace,Consolas,monospace}
body{display:flex;flex-direction:column}
nav{padding:10px 0 0;text-align:center;border-bottom:2px solid #33403c}
button{border:2px solid #c9c0b2;border-bottom:0;background:#100d0b;color:#8f877b;font:inherit;padding:8px 18px;margin:0 3px;cursor:pointer}
button:hover{color:#e9e2d4}
button.on{border-color:#c9a45c;color:#c9a45c}
iframe{flex:1;border:0}
</style>
<nav></nav>
<iframe allow="autoplay"></iframe>
<script>
const PAGES = [['Places', 'places.html']]
const frame = document.querySelector('iframe'), tabs = PAGES.map(([name, src]) => {
  const b = document.querySelector('nav').appendChild(document.createElement('button'))
  b.textContent = name
  b.onclick = () => {
    frame.src = src
    tabs.forEach(t => t.classList.toggle('on', t === b))
  }
  return b
})
tabs[Math.max(0, PAGES.findIndex(p => p[1] === location.hash.slice(1) + '.html'))]?.click()
</script>
